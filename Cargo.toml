[workspace]
resolver = "2"
members = [
    "crates/robochibi-core",
    "crates/robochibi-audio",
    "crates/robochibi-render",
    "crates/robochibi-server",
    "crates/robochibi-web",
    "crates/robochibi-native",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Jose Javier <josejavierpc5@gmail.com>"]
license = "ISC"

[workspace.dependencies]
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30.0"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
