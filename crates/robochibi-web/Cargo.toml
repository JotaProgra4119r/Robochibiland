[package]
name = "robochibi-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
robochibi-core = { path = "../robochibi-core" }
robochibi-audio = { path = "../robochibi-audio" }
robochibi-render = { path = "../robochibi-render" }
wgpu = { workspace = true, features = ["webgl", "webgpu", "wgsl"] }
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlButtonElement",
    "DomTokenList",
    "CssStyleDeclaration",
    "Node",
    "NodeList",
    "CanvasRenderingContext2d",
    "ImageData",
    "Location",
    "Storage",
    "Navigator",
    "Clipboard",
    "Performance",
    "History",
    "Url",
    "UrlSearchParams",
    "Blob",
    "BlobPropertyBag",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "DomRect",
    "console",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
]
